[package]
name         = "pipeline-svc-saf"
version      = "0.1.0"
edition      = "2021"
license      = "MIT OR Apache-2.0"
authors      = ["SWE Engineering Labs"]
repository   = "https://github.com/sweengineeringlabs/pipeline-svc"
rust-version = "1.98"
description  = "pipeline-svc SAF: construction factory for the in-memory Pipeline implementation."
keywords     = ["pipeline", "saf", "async", "swe"]
categories   = ["asynchronous"]

[package.metadata.arch]
application_type = "facade"
service_type     = "pipeline"

[lib]
name = "pipeline_svc_saf"
path = "src/lib.rs"

[dependencies]
pipeline-pattern  = { git = "https://github.com/sweengineeringlabs/pipeline-pattern.git", tag = "v0.1.0" }
pipeline-svc-core = { path = "../core", version = "0.1.0" }

[dev-dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code  = "deny"
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
